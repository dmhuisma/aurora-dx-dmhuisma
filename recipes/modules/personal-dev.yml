---
modules:
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
    install:
      packages:
        - ghostty
        # Build essentials not already in aurora-dx-nvidia-open
        - gcc-c++
        - clang
        - cmake
        - ninja-build
        - gtk3-devel
        # Zephyr / embedded firmware build dependencies
        - dtc
        - gperf
        - dfu-util
        - python3-pip
        - python3-devel
        - systemd-devel
        - SDL2-devel
        - glibc-devel.i686
        # USB access for programmers and debuggers (JLink, nRF, OpenOCD)
        # libusb1-devel is the libusb 1.0 dev package in Fedora (libusb-devel does not exist)
        - libusb1-devel
        - libusb-compat-0.1
        # OpenOCD for JTAG/SWD debugging (complement to JLink)
        - openocd
        # Other
        - python-tkinter
        - spice-protocol
        - spice-server-devel
        - nettle-devel
        - pipewire-devel
        - libsamplerate-devel
        - sdcc
        - fira-code-fonts

  - type: script
    scripts:
      - install-arm-toolchain.sh
      - install-zephyr-sdk.sh
      - install-nrfutil.sh
      - install-jlink.sh

  # hyprland
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        - noctalia-hyprland-meta
        - hyprland-devel
        - mesa-libgbm-devel
        - xorg-x11-server-Xwayland-devel
        - hyprpolkitagent
        - hyprshot
        - hyprqt6engine
        - playerctl
        - udiskie

  # GTK / GNOME system applications for the Hyprland session
  # (the KDE session keeps using Dolphin, Ark, etc.)
  - type: dnf
    install:
      packages:
        # File chooser portal (GTK file picker). Point Hyprland at it with
        # ~/.config/xdg-desktop-portal/hyprland-portals.conf:
        #   [preferred]
        #   default=hyprland;gtk
        #   org.freedesktop.impl.portal.FileChooser=gtk
        - xdg-desktop-portal-gtk
        # File management
        - nautilus
        - nautilus-extensions
        - file-roller          # archive manager (integrates with nautilus)
        - gvfs-mtp             # phones / MTP devices in nautilus
        - gvfs-smb             # SMB network shares in nautilus
        - gvfs-archive         # browse archives as folders
        - gvfs-gphoto2         # cameras
        # Viewers / utilities
        - loupe                # image viewer
        - papers               # document / PDF viewer
        - gnome-text-editor
        - gnome-calculator
        - gnome-disk-utility
        - baobab               # disk usage analyzer
        - gnome-system-monitor
        - gnome-font-viewer
        - gnome-characters
        # GTK theming outside of GNOME
        - adw-gtk3-theme
        - nwg-look

  # voxtype
  - type: dnf
    repos:
      copr:
        - scottames/voxtype
    install:
      packages:
        - voxtype

  # update noctalia from testing repo
  # - type: script
  #   snippets:
  #     - dnf -y upgrade --enablerepo=updates-testing noctalia

  # packages from terra
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release
        - zed
